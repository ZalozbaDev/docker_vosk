name: ci-models
on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - 'unify_recognizers'
    tags:
      - "v*"
      - "jitsi_multilang"
  schedule:
    - cron: "0 0 * * *"

#using-an-action
jobs:
  build-and-push-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        profile: ["hsb", "dsb"]
        include:
          - profile: hsb
            model: "Korla/whisper-large-v3-turbo-hsb-v1"
          - profile: dsb
            model: "Korla/whisper-large-v3-turbo-dsb"
    env:
      DOCKER_IMAGE_NAME: ${{ github.repository }}
      PUSH: ${{ toJSON(github.event_name != 'pull_request') }}
    steps:
      # Setup Docker Environment
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Cache
        uses: actions/cache@v5
        with:
          path: |
            /tmp/.buildx-cache
          key: buildx|${{ secrets.CACHE_DATE }}|${{ runner.os }}
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to the GitHub Container registry
        uses: docker/login-action@v3
        with:
          registry: https://ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Docker meta for public images
        if: ${{ fromJSON(env.PUSH) }}
        id: docker_meta_public
        uses: crazy-max/ghaction-docker-meta@v5
        with:
          images: |
            ghcr.io/${{ env.DOCKER_IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            # edge images
            type=edge,branch=main
            # schedule (nightly) images
            type=schedule,pattern=nightly
      - name: Setup oras
        uses: oras-project/setup-oras@v1
      - name: Build model
        run: |
          mkdir cache
          mkdir whisper_models
          docker run -e MODEL=${{matrix.model}} --mount type=bind,source=./cache,target=/cache/ --mount type=bind,source=./whisper_models,target=/output/ ghcr.io/zalozbadev/mudrowak:main /convert.sh
      - name: Package model
        run: |
          oras push ghcr.io/zalozbadev/docker_vosk/model-${{matrix.profile}}:${{ github.sha }} './whisper_models'
